{% extends 'layout.html' %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<main class="login-main mt-50">
    <div class="d-flex justify-content-center align-items-center w-100">

        <div class="login-card" style="max-width: 420px; width: 100%;">

            <div class="login-greet mb-4 text-center">
                <h1 class="h1-login">Forgot Password</h1>

                <p class="p-login-sub">
                    Enter your email and we'll send you a reset link.
                </p>
            </div>

            <form method="POST" class="d-flex flex-column">
                {% csrf_token %}

                <div class="form-group mb-3">
                    <label class="form-label" for="resetEmail">
                        Email <span class="text-danger">*</span>
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="resetEmail"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <button type="submit" class="btn login-btn mb-3">
                    Send
                </button>

                <a href="{% url 'users:login' %}" class="forgot-pass text-center">
                    Back to Login
                </a>

            </form>

        </div>

    </div>
</main>

{% endblock %}
