{% extends 'layout.html' %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}

<main class="login-main mt-50">
    <div class="d-flex justify-content-center align-items-center w-100">

        <div class="login-card" style="max-width: 420px; width: 100%;">

            <div class="login-greet mb-4 text-center">
                <h1 class="h1-login">Sent</h1>

                <p class="p-login-sub">
                    Check your email for the password reset link.
                </p>
            </div>

            <a href="{% url 'users:login' %}" class="btn login-btn mb-3 w-100">
                Back to Login
            </a>

        </div>

    </div>
</main>

{% endblock %}
