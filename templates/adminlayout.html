{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archeion – {% block title %}Admin{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'imgs/logo/archeion-icon.png' %}" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/admin_db.css' %}" />

    <script src="{% static 'js/script.js' %}" defer></script>

    {% block extra_head %}{% endblock %}
  </head>

<body class="admin-page d-flex">

    <!-- Mobile Header (Hidden on Desktop) -->
    <header class="admin-mobile-header d-md-none d-flex align-items-center justify-content-between position-fixed top-0 w-100">
      <img src="{% static 'imgs/logo/archeion_light.png' %}" alt="Archeion" class="mobile-logo" />
      <button id="sidebarToggle" class="btn text-white p-0 fs-1 border-0">
        <i class="bi bi-list"></i>
      </button>
    </header>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebarOverlay" class="admin-sidebar-overlay d-md-none"></div>

    <!-- Sidebar -->
        <aside class="admin-sidebar d-flex flex-column vh-100 position-sticky top-0">
        <img src="{% static 'imgs/logo/archeion_light.png' %}" alt="Archeion" class="admin-sidebar-logo" />
      <nav class="nav flex-column gap-2 flex-grow-1">
       <a class="admin-nav-link {% if '/dashboard/' in request.path %}active{% endif %}" href="{% url 'administratordb:admin_dashboard' %}">
        <i class="bi bi-house-door-fill"></i> Dashboard
      </a>
      <a class="admin-nav-link {% if '/users/' in request.path %}active{% endif %}" href="{% url 'administratordb:admin_users' %}">
        <i class="bi bi-people-fill"></i> Users
      </a>
      <a class="admin-nav-link {% if '/research/' in request.path %}active{% endif %}" href="{% url 'administratordb:admin_research' %}">
        <i class="bi bi-file-earmark-text-fill"></i> Research
      </a>
      <a class="admin-nav-link {% if '/feedback/' in request.path %}active{% endif %}" href="{% url 'administratordb:admin_feedback' %}">
        <i class="bi bi-star-fill"></i> Feedback
      </a>
          <a class="admin-nav-link" href="{% url 'landing' %}">
          <i class="bi bi-globe"></i> Website
        </a>
        
        {% if request.user.is_superuser %}
        <a class="admin-nav-link" href="{% url 'admin:index' %}">
          <i class="bi bi-lock"></i> SuperAdmin
        </a>
      {% endif %}


      </nav>

        <form action="{% url 'administratordb:admin_logout' %}" method="post" class="mb-5 mt-auto">
            {% csrf_token %}
            <button type="submit" class="admin-logout-btn">Logout</button>
          </form>
    </aside>

    <main class="admin-main">
      {% block content %}{% endblock %}
      
    </main>

  </body>
</html>
