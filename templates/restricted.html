{% extends "layout.html" %}
{% load static %}

{% block title %}Login Required – Archeion{% endblock %}

{% block content %}
<main class="error-main mt-100">
    <div class="text-center">
        <i class="bi bi-door-open-fill error-icon"></i>
        <h1 class="h1-error-title">Before we let you in...</h1>
        <p class="p-error-sub">Log in or create an account to continue to Archeion.</p>

        <div class="d-flex gap-2 align-items-center justify-content-center mt-5 mb-5 flex-wrap">
            <a href="{% url 'users:login' %}" class="btn btn-secondary error-btn">Login</a>
            <a href="{% url 'users:signup' %}" class="btn btn-primary error-btn">Sign Up</a>
        </div>
    </div>
</main>
{% endblock %}
