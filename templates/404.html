    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    <link rel="preconnect" href="https://fonts.googleapis.com" />

        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

</head>

<body>
   
    <main class="error-main mt-100">
        <div class="text-center">
            <i class="bi bi-exclamation-diamond-fill error-icon"></i>
            <h1 class="h1-error-title">Page not Found</h1>
            <p class="p-error-sub">
                A page you are looking may be unavailable, removed or an
                error
                occurred.
            </p>
            <p class="p-error-code">Error Code : 404</p>
            <a href="{% url 'landing' %}" class="btn btn-secondary mt-3 error-btn">Go Back
                Home</a>
        </div>
    </main>

    <footer class="footer mt-auto">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-copy">© 2026 Archeion</span>

                <span class="footer-brand">Tarlac State University –
                    CCS</span>

                <div class="footer-links">
                    <a href="{% url 'about' %}">About Us</a>
                    <a href="{% url 'contact' %}">Contact Us</a>
                    <a href="{% url 'tos' %}">Terms of Service</a>
                    <a href="{% url 'privacy_policy' %}">Privacy Policy</a>
                </div>
            </div>
        </div>
    </footer>
