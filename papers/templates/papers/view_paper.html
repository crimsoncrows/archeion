{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paper.title }}</title>
    <link rel="shortcut icon" href="{% static 'imgs/logo/archeion-icon.png' %}" type="image/x-icon" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/paper.css' %}" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
</head>
<body oncontextmenu="return false"> 

    <div id="toolbar">
        <span class="document-title">{{ paper.title }}</span>
        <span class="page-info">Pages: <span id="page-count">–</span></span>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading document…</p>
    </div>
    
    <div id="pdf-container" data-pdf-url="{% url 'papers:stream_paper_pdf' paper.paper_id %}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script src="{% static 'js/paper.js' %}" defer></script>
</body>
</html>
